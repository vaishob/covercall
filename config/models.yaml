# CoverCall Model Registry (§1.3, §7.1)
# All data is synthetic. Every model call logs model_id and prompt_hash.
# A service MUST refuse to start if a model role it uses has model_id: TODO-VERIFY.

roles:
  voice:
    provider: google_genai_live
    api_version: v1alpha
    model_id: gemini-3.1-flash-live-preview
    pinned_at: "2026-10-18"
    called_from: browser_ephemeral_token
    ephemeral_token_start_ttl_s: 60     # design default (chosen, see §1.3 & §7.2)
    ephemeral_token_session_ttl_s: 1800 # design default (chosen, see §1.3 & §7.2)
    health_check_interval_h: 3          # design default (chosen, see §7.1)
    fallback_order:
      - hands_free
      - push_to_talk
      - text

  agent:
    provider: vertex_ai_adk
    api_version: v1
    model_id: gemini-2.5-flash
    pinned_at: "2026-10-18"
    called_from: workflow_step
    temperature: 0.0                    # design default (chosen, see §7.6)
    parse_confidence_min: 0.7           # design default (chosen, see §7.3)
    draft_max_chars: 300                # design default (chosen, see §7.3)
    max_retries: 1                      # design default (chosen, see §7.3)

  persona_sim:
    provider: vertex_ai
    api_version: v1
    model_id: gemini-2.5-flash
    pinned_at: "2026-10-18"
    called_from: persona_sim_service
    temperature: 0.8                    # design default (chosen, see §1.3 & §7.6)
    database_scope: sim

  guard:
    provider: cloud_run_cpu
    api_version: v1
    model_id: TODO-VERIFY               # Slice 5 fine-tuned Gemma 3 270M weight checkpoint; Slices 1-2 use deterministic stub-v0
    guard_impl: stub-v0
    pinned_at: "2026-10-18"
    called_from: workflow_step
    fail_closed: true

  eval_judge:
    provider: vertex_ai
    api_version: v1
    model_id: gemini-2.5-pro
    pinned_at: "2026-10-18"
    called_from: cloud_build_only
    temperature: 0.0                    # design default (chosen, see §7.6)
    calibration_set_size: 30            # design default (chosen, see §7.5)
