# CoverCall model registry (§1.3, §7.1). All data is synthetic.
# A service MUST refuse to start if a model role it uses has model_id TODO-VERIFY, and name the role.
# Every model call logs model_id and the SHA-256 of its prompt file (prompts/*.md).
#
# Pinned 2026-10-18 against Google's documentation (decisions 0019, 0020, 0021):
# - Gemini API models page (updated 2026-10-13): gemini-3.8-live is Stable and the default Live
#   model; gemini-3.8-flash and gemini-4-argon are Stable; gemini-3.1-flash-live-preview is legacy;
#   the 2.5 family is restricted to existing users.
# - Live API ephemeral tokens page (updated 2026-09-15): Preview, Live API only, v1beta only.
# - Gemini Enterprise Agent Platform (formerly Vertex AI) locations page (updated 2026-10-15):
#   gemini-3.8-flash and gemini-4-argon are served on the global endpoint.
# Pinning an ID does not switch a service on: agent and persona_sim still run their stub-v0
# implementations until they are explicitly enabled. No model is called in Slices 1-3.

roles:
  voice:
    # source: https://ai.google.dev/gemini-api/docs/models
    # source: https://ai.google.dev/gemini-api/docs/live-api/ephemeral-tokens
    provider: gemini_developer_api
    api_version: v1beta                  # ephemeral tokens work only on v1beta (decision 0019)
    model_id: gemini-3.8-live
    pinned_at: 2026-10-18
    called_from: browser_ephemeral_token
    token_minted_by: api                 # client.auth_tokens.create, key from Secret Manager GEMINI_API_KEY
    ephemeral_token_uses: 1              # Google default (ephemeral-tokens page)
    ephemeral_token_start_ttl_s: 60      # Google default: 1 minute to start a session
    ephemeral_token_session_ttl_s: 1800  # Google default: 30 minutes of messages
    health_check_interval_h: 3           # design default (PDF §7.1)
    fallback_order: [hands_free, push_to_talk, text]

  agent:
    # Served on the Gemini Developer API (v1beta) when PARSER_BACKEND=developer (production; decision 0026).
    # source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/locations
    provider: vertex_ai
    framework: adk
    api_version: v1
    location: global                     # decision 0021
    model_id: gemini-3.8-flash
    pinned_at: 2026-10-18
    called_from: workflow_step
    temperature: 0.0                     # design default (PDF §7.6)
    prompt_files: [prompts/parse_reply.md, prompts/explain_plan.md, prompts/draft_offer.md]

  persona_sim:
    # source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/locations
    provider: vertex_ai
    api_version: v1
    location: global                     # decision 0021
    model_id: gemini-3.8-flash
    pinned_at: 2026-10-18
    called_from: persona_sim_service
    temperature: 0.8                     # design default (PDF §7.6), seeded
    database_scope: sim

  guard:
    # Base checkpoint: google/gemma-3-270m. The fine-tuned weights come in Slice 5; until then
    # services/guard runs the deterministic fail-closed stub guard_impl stub-v0 (no model).
    provider: cloud_run_cpu
    api_version: v1
    model_id: TODO-VERIFY
    pinned_at: null
    called_from: workflow_step
    fail_closed: true

  eval_judge:
    # source: https://ai.google.dev/gemini-api/docs/models
    # source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/locations
    provider: vertex_ai
    api_version: v1
    location: global                     # decision 0021
    model_id: gemini-4-argon             # stronger than the gemini-3.8-flash models it grades (decision 0020)
    pinned_at: 2026-10-18
    called_from: cloud_build_only
    temperature: 0.0                     # design default (PDF §7.6)
    calibration_set_size: 30             # design default (PDF §7.5)
