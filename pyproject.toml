[project]
name = "covercall"
version = "0.2.0"
description = "CoverCall — Provably legal shift absence coverage engine and outreach cascade (All data is synthetic)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools>=9.10",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-cloud-firestore>=2.16",
    "google-cloud-workflows>=1.14",
    "google-genai>=1.0",
    "google-adk>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["policy/**/*.py", "datagen/**/*.py", "baseline/**/*.py", "evals/**/*.py", "services/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["policy", "datagen", "baseline", "evals", "services", "tests"]
