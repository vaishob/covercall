id: CO-REST-BETWEEN-SHIFTS
title: At least 11 hours between the end of one shift and the start of the next
kind: hard
jurisdiction: SG
source:
  publisher: Synthetic company policy
  title: CoverCall synthetic company policy (design defaults)
  url: policy/company.yaml
  section: rest_between_shifts_h
  source_last_updated: 2026-10-18
