id: SG-EA4-OT-RATE
title: Overtime pay at 1.5 times the hourly basic rate
kind: cost
jurisdiction: SG
source:
  publisher: Ministry of Manpower (MOM)
  title: Hours of work, overtime and rest day
  url: https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
  section: Overtime pay
  source_last_updated: 2025-07-24
  retrieved: 2026-10-18
applies_when: employee.part4_covered == true and employee.monthly_rated == true
params:
  ot_multiplier: 1.5
  hourly_rate_numerator_months: 12
  hourly_rate_denominator_weeks: 52
  hourly_rate_denominator_hours: 44
  non_workman_hourly_rate_cap_sgd: 13.60
message: "{name}: {ot_hours} overtime hours at 1.5 x S${hourly_rate}/h = S${ot_cost_sgd}."
tests:
  - fixture: ot_rate_ft_covered
    expect: ok
  - fixture: ot_rate_manager_exempt
    expect: not_applicable
