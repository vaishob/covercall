id: CO-OPENER-KEYHOLDER
title: Opening shifts need at least one key-holder
kind: hard
jurisdiction: SG
source:
  publisher: Synthetic company policy
  title: CoverCall synthetic company policy (design defaults)
  url: policy/company.yaml
  section: opener_keyholder
  source_last_updated: 2026-10-18
  retrieved: 2026-10-18
applies_when: shift.is_opening == true
params:
  min_keyholders_at_opening: 1
message: "{name}: is not a key-holder and no other key-holder opens {outlet} at {open_time}."
tests:
  - fixture: opener_no_keyholder_violation
    expect: violation
  - fixture: opener_non_opening_shift_na
    expect: not_applicable
  - fixture: opener_other_keyholder_ok
    expect: ok
