id: CO-STATION-SKILL
title: The assignee holds the station's skill tag
kind: hard
jurisdiction: SG
source:
  publisher: Synthetic company policy
  title: CoverCall synthetic company policy (design defaults)
  url: policy/company.yaml
  section: station_skill
  source_last_updated: 2026-10-18
  retrieved: 2026-10-18
applies_when: "true"
params:
  skill_tags: [barista, kitchen, cashier]
message: "{name}: does not hold the {station} skill (holds: {skills})."
tests:
  - fixture: skill_missing_barista
    expect: violation
  - fixture: skill_has_barista
    expect: ok
