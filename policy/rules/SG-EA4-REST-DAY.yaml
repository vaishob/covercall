id: SG-EA4-REST-DAY
title: Rest day each week; at most 12 days between rest days; rest-day work only by offer
kind: hard
jurisdiction: SG
source:
  publisher: Ministry of Manpower (MOM)
  title: Hours of work, overtime and rest day
  url: https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
  section: Rest day
  source_last_updated: 2025-07-24
  retrieved: 2026-10-18
applies_when: employee.part4_covered == true
params:
  max_days_between_rest_days: 12
  min_rest_days_per_week: 1
  week_starts_on: monday
  rest_day_work_may_be_compelled: false
message: "{name}: working {date} makes {run_days} consecutive days of work (EA Part 4 allows at most {max_days} days between rest days) and leaves {week_rest_days} day(s) off in that week."
tests:
  - fixture: rest_day_13_days_violation
    expect: violation
  - fixture: rest_day_5_days_ok
    expect: ok
  - fixture: rest_day_week_without_rest_violation
    expect: violation
  - fixture: rest_day_compelled_violation
    expect: violation
