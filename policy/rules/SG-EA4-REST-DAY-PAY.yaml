id: SG-EA4-REST-DAY-PAY
title: Pay for work on a rest day at the employer's request
kind: cost
jurisdiction: SG
source:
  publisher: Ministry of Manpower (MOM)
  title: Hours of work, overtime and rest day
  url: https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
  section: Calculate your pay for work on a rest day
  source_last_updated: 2025-07-24
  retrieved: 2026-10-18
applies_when: employee.part4_covered == true and employee.monthly_rated == true and shift.is_rest_day == true
params:
  days_pay_up_to_half_normal_day: 1
  days_pay_more_than_half_normal_day: 2
  beyond_normal_day_adds_overtime: true
  daily_rate_source: "MOM, Monthly and daily salary: definitions and calculation, https://www.mom.gov.sg/employment-practices/salary/monthly-and-daily-salary (last updated 2025-12-08): basic rate of pay for one day = (12 x monthly basic) / (52 x average days worked per week)"
message: "{name}: {day_hours} hours on a rest day at the employer's request = {days_pay} day(s) of basic pay (S${rest_day_cost_sgd})."
tests:
  - fixture: rest_day_pay_full_shift
    expect: ok
  - fixture: rest_day_pay_regular_day_na
    expect: not_applicable
