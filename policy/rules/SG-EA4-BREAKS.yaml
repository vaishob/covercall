id: SG-EA4-BREAKS
title: Breaks during continuous work
kind: hard
jurisdiction: SG
source:
  publisher: Ministry of Manpower (MOM)
  title: Hours of work, overtime and rest day
  url: https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
  section: Break times
  source_last_updated: 2025-07-24
  retrieved: 2026-10-18
applies_when: employee.part4_covered == true
params:
  max_consecutive_hours_without_break: 6
  min_total_break_min: 45
message: "{name}: {longest_stretch_h} hours without a break and {break_min} minutes of breaks in a {block_h}-hour stretch of work. EA Part 4 allows at most {max_consecutive_h} hours without a break and needs at least {min_break_min} minutes of breaks."
tests:
  - fixture: breaks_8h_no_break_violation
    expect: violation
  - fixture: breaks_8h_with_45min_ok
    expect: ok
