id: SG-SFA-FSC-L1
title: WSQ Food Safety Course Level 1 for food and beverage handlers
kind: hard
jurisdiction: SG
source:
  publisher: Singapore Food Agency (SFA)
  title: WSQ Food Safety Course (FSC) Level 1
  url: https://www.sfa.gov.sg/food-handler-hygiene-officer/training-courses/wsq-food-safety-course-level-1
  section: "Who must attain WSQ FSC Level 1 certification?"
  source_last_updated: 2026-08-24
  retrieved: 2026-10-18
applies_when: shift.food_handling == true and (shift.station != "barista" or company.enforce_fsc_on_barista == true)
params:
  first_refresher_within_years: 5
message: "{name}: WSQ Food Safety Course Level 1 is {cert_status}. Required at the {station} station (first refresher within 5 years of passing)."
tests:
  - fixture: fsc_lapsed_barista_violation
    expect: violation
  - fixture: fsc_cashier_station_na
    expect: not_applicable
  - fixture: fsc_valid_kitchen_ok
    expect: ok
  - fixture: fsc_missing_kitchen_violation
    expect: violation
