id: SG-EA4-NORMAL-HOURS
title: Normal hours of work; work beyond them is overtime
kind: cost
jurisdiction: SG
source:
  publisher: Ministry of Manpower (MOM)
  title: Hours of work, overtime and rest day
  url: https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
  section: Normal hours of work
  source_last_updated: 2025-07-24
  retrieved: 2026-10-18
applies_when: employee.part4_covered == true
params:
  max_normal_daily_hours_5_days_or_less: 9
  max_normal_daily_hours_more_than_5_days: 8
  max_normal_weekly_hours: 44
message: "{name}: this shift adds {ot_added} overtime hours ({day_hours} h that day against {normal_daily_hours} h normal; {week_hours} h that week against {normal_weekly_hours} h normal)."
tests:
  - fixture: normal_hours_within_contract
    expect: ok
  - fixture: normal_hours_manager_not_covered
    expect: not_applicable
